<!DOCTYPE html>
<html lang="es">
<head>
 <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login de Administrador</title>

<!-- Icono y manifest -->
<link rel="icon" type="image/png" href="img/icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">

<link rel="stylesheet" href="css/style.css">

</head>
<body>
  <!-- contenedor principal del login -->
  <main class="login-admin">
    <h2>Panel de Administrador</h2>
    
    <!-- formulario de acceso -->
    <form id="adminLoginForm">
      <input type="text" name="username" placeholder="Usuario" required>
      <input type="password" name="password" placeholder="Contraseña" required>
      <button type="submit">Ingresar</button>
    </form>
    
    <!-- mensaje de respuesta del login -->
    <p id="loginMsg"></p>
    
    <!-- mensaje de error adicional (duplicado, probablemente se puede eliminar uno) -->
    <div id="login-msg" style="color: red; margin-top: 10px;"></div>
  </main>

  <!-- script para manejar el login -->
  <script src="js/admin-login.js"></script>
  <script type="module" src="js/script.js"></script>

</body>
</html>
